<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core">

<ui:composition>
<h:form id="addSupplierForm">
    <f:event type="preRenderView" listener="#{supplierBean.loadAll}" />
    <p:messages showDetail="true" closable="true"/>
    <p:steps activeIndex="#{supplierBean.activeIndex}" styleClass="custom-steps">
        <p:menuitem value="Supplier Details" icon="pi pi-briefcase" />
        <p:menuitem value="Contact Details" icon="pi pi-phone" />
        <p:menuitem value="Confirmation" icon="pi pi-check" />
        <p:menuitem value="Complete" icon="pi pi-check-circle" />
    </p:steps>

    <!-- Step 0: Supplier Info -->
    <p:outputPanel rendered="#{supplierBean.activeIndex == 0}">
        <p:panelGrid columns="2" layout="grid" styleClass="p-fluid" columnClasses="col-12 md:col-3, col-12 md:col-9" style="margin-top: 20px">
            <p:outputLabel for="supplierName" value="Supplier Name"/>
            <p:inputText id="supplierName" value="#{supplierBean.supplierName}" required="true" requiredMessage="Supplier name is required"/>

            <p:outputLabel for="supplierVatNumber" value="VAT Number"/>
            <p:inputText id="supplierVatNumber" value="#{supplierBean.vatNumber}" />

            <p:outputLabel for="supplierDescription" value="Description"/>
            <p:inputTextarea rows="4" id="supplierDescription" value="#{supplierBean.supplierDescription}" />

            <p:outputLabel for="supplierType" value="Supplier Type"/>
            <p:selectOneMenu id="supplierType" value="#{supplierBean.supplierType}">
                <f:selectItem itemLabel="Select One" itemValue=""/>
                <f:selectItems value="#{supplierBean.supplierTypes}" var="type" itemLabel="#{type.supplierType}" itemValue="#{type}"/>
            </p:selectOneMenu>
        </p:panelGrid>
        <p:commandButton value="Next" actionListener="#{supplierBean.next}" process="@form" update="@form" icon="pi pi-arrow-right"/>
    </p:outputPanel>

    <!-- Step 1: Contact Details -->
    <p:outputPanel rendered="#{supplierBean.activeIndex == 1}">
        <p:panelGrid id="add-det" columns="2" layout="grid" styleClass="p-fluid" columnClasses="col-12 md:col-3, col-12 md:col-9" style="margin-top: 20px">
            <ui:repeat value="#{supplierBean.contactInfoLineList}" var="contactInfo" varStatus="vs">
                <p:outputLabel for="@next" value="Contact Name" />
                <p:inputText id="contactName_#{vs.index}" value="#{contactInfo.contactInfoLineName}" />

                <p:outputLabel for="@next" value="Contact Value" />
                <p:inputText id="contactValue_#{vs.index}" value="#{contactInfo.contactInfoLineValue}" />

                <p:outputLabel for="@next" value="Contact Type" />
                <p:selectOneMenu id="contactType_#{vs.index}" value="#{contactInfo.contactInfoLineType}">
                    <f:selectItem itemLabel="Select One" itemValue="" noSelectionOption="true" />
                    <f:selectItem itemLabel="Email" itemValue="email" />
                    <f:selectItem itemLabel="Phone" itemValue="phone" />
                    <f:selectItem itemLabel="Cell" itemValue="cell" />
                </p:selectOneMenu>

                <p:outputLabel for="@next" value="Status" />
                <p:selectOneMenu id="contactStatus_#{vs.index}" value="#{contactInfo.contactInfoLineStatus}">
                    <f:selectItem itemLabel="Active" itemValue="1" />
                    <f:selectItem itemLabel="Inactive" itemValue="2" />
                </p:selectOneMenu>

                <p:outputLabel for="@next" value="Description" />
                <p:inputTextarea id="contactDescription_#{vs.index}" value="#{contactInfo.contactInfoLineDescription}" rows="3" />

                <p:divider styleClass="col-12"/>
            </ui:repeat>
            <p:commandButton value="Add Contact" actionListener="#{supplierBean.addSupplierAdrresses}" process="@this" update="add-det" icon="pi pi-plus" />
        </p:panelGrid>
        <p:commandButton value="Back" action="#{supplierBean.previous}" update="@form" styleClass="p-button-secondary" icon="pi pi-arrow-left"/>
        <p:commandButton value="Next" actionListener="#{supplierBean.next}" process="@form" update="@form" icon="pi pi-arrow-right"/>
    </p:outputPanel>

    <!-- Step 2: Confirmation -->
    <p:outputPanel rendered="#{supplierBean.activeIndex == 2}">
        <p:card>
            <h:panelGrid columns="2" columnClasses="col-6, col-6">
                <h:outputText value="Supplier:" />
                <b><h:outputText value="#{supplierBean.supplierName}" /></b>
                <h:outputText value="VAT:" />
                <h:outputText value="#{supplierBean.vatNumber}" />
                <h:outputText value="Type:" />
                <h:outputText value="#{supplierBean.supplierType}" />
            </h:panelGrid>

            <p:divider/>
            <h:panelGrid columns="1" columnClasses="col-12">
                <h:outputText value="Contact Information" styleClass="font-bold"/>
                <p:outputPanel rendered="#{supplierBean.contactInfoEmpty}">
                    <div class="flex align-items-center justify-content-start">
                        <h:graphicImage value="/resources/img/com_error.png" style="height: 24px;"/>
                    </div>
                </p:outputPanel>
                <p:outputPanel rendered="#{not supplierBean.contactInfoEmpty}">
                    <ui:repeat value="#{supplierBean.contactInfoLineList}" var="c">
                        <div class="p-d-flex p-ai-center p-mb-2">
                            <i class="pi #{c.contactInfoLineType eq 'email' ? 'pi-at' : (c.contactInfoLineType eq 'phone' ? 'pi-phone' : (c.contactInfoLineType eq 'cell' ? 'pi-mobile' : 'pi-info-circle'))} p-mr-2"/>
                            <h:outputText value="#{c.contactInfoLineName}: " styleClass="font-bold p-mr-1"/>
                            <h:outputText value="#{c.contactInfoLineValue}"/>
                            <h:outputText value=" (#{c.contactInfoLineType})" styleClass="text-500 p-ml-2" rendered="#{not empty c.contactInfoLineType}"/>
                        </div>
                        <p:divider styleClass="my-2"/>
                    </ui:repeat>
                </p:outputPanel>
            </h:panelGrid>
        </p:card>
        <p:commandButton value="Back" action="#{supplierBean.previous}" update="@form" styleClass="p-button-secondary" icon="pi pi-arrow-left"/>
        <p:commandButton value="Submit" actionListener="#{supplierBean.save}" update="@form" icon="pi pi-save"/>
    </p:outputPanel>

    <!-- Step 3: Complete -->
    <p:outputPanel rendered="#{supplierBean.activeIndex == 3}">
        <p:card>
            <h:outputText value="Supplier saved successfully."/>
            <div class="p-mt-3">
                <h:link outcome="/ui/pages/componants/supplier/listSupplier" value="Back to Suppliers" />
            </div>
        </p:card>
    </p:outputPanel>

</h:form>


</ui:composition>


</html>
