<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core">

    <ui:composition>

        <p:card title="Add Stock" style="width: 100%">
            <h:form id="addStockForm">
                <p:messages showDetail="true" closable="true"/>
                <p:panelGrid columns="2" layout="grid" styleClass="p-fluid" columnClasses="col-12 md:col-3, col-12 md:col-9">
                    <p:outputLabel for="productName" value="Product Name"/>
                    <p:inputText id="productName" value="#{productBean.productName}" required="true" requiredMessage="Product name is required" placeholder="e.g. Coca-Cola 330ml"/>

                    <p:outputLabel for="displayImageName" value="Display Image Name"/>
                    <p:inputText id="displayImageName" value="#{productBean.displayImageName}" placeholder="e.g. coke.png"/>

                    <p:outputLabel for="barcode" value="Barcode"/>
                    <p:inputText id="barcode" value="#{productBean.barcode}"/>

                    <p:outputLabel for="price" value="Price"/>
                    <p:inputNumber id="price" value="#{productBean.price}" mode="decimal" decimalPlaces="2" required="true" requiredMessage="Price is required"/>

                    <p:outputLabel for="category" value="Category"/>
                    <p:selectOneMenu id="category" value="#{productBean.categoryId}" required="true" requiredMessage="Category is required">
                        <f:selectItem itemLabel="Select One" noSelectionOption="true" />
                        <f:selectItems value="#{productBean.categories}" var="c" itemLabel="#{c.categoryName}" itemValue="#{c.id}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="status" value="Status"/>
                    <p:selectOneMenu id="status" value="#{productBean.status}" required="true" requiredMessage="Status is required">
                        <f:selectItems value="#{productBean.statuses}" var="s" itemLabel="#{s.desc}" itemValue="#{s}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="supplier" value="Supplier"/>
                    <p:selectOneMenu id="supplier" value="#{productBean.supplierId}">
                        <f:selectItem itemLabel="Select One" noSelectionOption="true" />
                        <f:selectItems value="#{productBean.suppliers}" var="sup" itemLabel="#{sup.supplierName}" itemValue="#{sup.id}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="packageType" value="Package Type"/>
                    <p:selectOneMenu id="packageType" value="#{productBean.packageTypeId}">
                        <f:selectItem itemLabel="Select One" noSelectionOption="true" />
                        <f:selectItems value="#{productBean.packageTypes}" var="pt" itemLabel="#{pt.unitsPerPackage} x (#{pt.totalNumberPerPackage})" itemValue="#{pt.id}"/>
                    </p:selectOneMenu>
                </p:panelGrid>

                <div class="p-mt-3">
                    <p:commandButton value="Save" icon="pi pi-save" actionListener="#{productBean.save}" update="@form"/>
                    <p:commandButton value="Reset" icon="pi pi-refresh" type="reset" styleClass="p-button-secondary p-ml-2"/>
                </div>
            </h:form>
        </p:card>

    </ui:composition>
</html>
